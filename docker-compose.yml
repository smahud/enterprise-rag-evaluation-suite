version: '3.8'

services:
  rag-eval:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rag-eval
    environment:
      - RAG_RETRIEVAL_EMBEDDER=BAAI/bge-large-en-v1.5
      - RAG_RERANKING_MODEL=BAAI/bge-reranker-large
      - RAG_GENERATION_MODEL=gpt-4o-mini
      - RAG_GENERATION_API_KEY=${OPENAI_API_KEY}
      - RAG_EVALUATION_SAMPLE_SIZE=1000
      - RAG_EVALUATION_METRICS=recall,ndcg,mrr,faithfulness,hallucination_rate,answer_relevance
      - RAG_OUTPUT_DIRECTORY=/app/results
      - RAG_OUTPUT_FORMATS=json,html,markdown
      - RAG_LOG_LEVEL=INFO
      - RAG_LOG_FORMAT=json
    volumes:
      - ./configs:/app/configs:ro
      - ./cache:/app/cache
      - ./results:/app/results
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 8G
        reservations:
          cpus: '2'
          memory: 4G
    command: ["run", "--dataset", "msmarco", "--retriever", "bge-large-en-v1.5", "--reranker", "bge-reranker-large", "--generator", "gpt-4o-mini", "--output", "/app/results"]

  qdrant:
    image: qdrant/qdrant:v1.9.0
    container_name: rag-eval-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant-data:/qdrant/storage
    deploy:
      resources:
        limits:
          memory: 2G

  prometheus:
    image: prom/prometheus:v2.52.0
    container_name: rag-eval-prometheus
    ports:
      - "9092:9090"
    volumes:
      - ./configs/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus

  grafana:
    image: grafana/grafana:10.4.0
    container_name: rag-eval-grafana
    ports:
      - "3002:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana-data:/var/lib/grafana

volumes:
  qdrant-data:
  prometheus-data:
  grafana-data: